<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors connexion — InfoDevis</title>
  <meta name="theme-color" content="#207752">
  <style>
    :root { --green: #207752; --ink: #2f3333; --muted: #5b605f; --bg: #faf9f8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      text-align: center;
    }
    .card { max-width: 420px; }
    .logo { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 2rem; margin-bottom: 28px; }
    .logo span { color: var(--green); }
    .icon { width: 76px; height: 76px; margin: 0 auto 20px; color: var(--green); }
    h1 { font-family: Georgia, serif; font-weight: 700; font-size: 1.6rem; margin: 0 0 10px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 26px; }
    button {
      background: var(--green); color: #fff; border: 0; border-radius: 12px;
      padding: 14px 26px; font-size: 15px; font-weight: 700; cursor: pointer;
      min-height: 48px; min-width: 160px;
    }
    button:active { opacity: .9; }
    .home { display: inline-block; margin-top: 16px; color: var(--green); text-decoration: none; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Info<span>Devis</span></div>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <h1>Vous êtes hors connexion</h1>
    <p>Impossible de charger cette page pour le moment. Vérifiez votre connexion internet, puis réessayez. Les pages déjà consultées restent accessibles.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <br>
    <a class="home" href="/">Retour à l'accueil</a>

    <section id="cached" style="margin-top:36px;text-align:left;display:none;">
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px;">Pages déjà consultées</p>
      <ul id="cached-list" style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;"></ul>
    </section>
  </main>
  <style>
    #cached-list a { display:block; padding:11px 12px; border-radius:10px; color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; background:#fff; border:1px solid #e6e9e8; }
    #cached-list a:active { background:#f0f0ee; }
  </style>
  <script>
    // Recharge automatiquement dès que la connexion revient.
    window.addEventListener('online', function () { location.reload(); });

    // Liste des pages HTML déjà en cache (consultation hors ligne).
    (async function () {
      if (!('caches' in window)) return;
      try {
        var names = await caches.keys();
        var pageCache = names.filter(function (n) { return n.indexOf('-pages') !== -1; })[0];
        if (!pageCache) return;
        var cache = await caches.open(pageCache);
        var reqs = await cache.keys();
        var seen = {}, items = [];
        reqs.forEach(function (req) {
          var u = new URL(req.url);
          if (u.pathname === '/offline.html') return;
          var label = u.pathname.replace(/\/$/, '').split('/').filter(Boolean).pop() || 'Accueil';
          label = decodeURIComponent(label).replace(/-/g, ' ');
          if (seen[u.pathname]) return; seen[u.pathname] = 1;
          items.push({ url: u.pathname, label: label.charAt(0).toUpperCase() + label.slice(1) });
        });
        if (!items.length) return;
        var ul = document.getElementById('cached-list');
        ul.innerHTML = items.slice(0, 8).map(function (i) { return '<li><a href="' + i.url + '">' + i.label + '</a></li>'; }).join('');
        document.getElementById('cached').style.display = 'block';
      } catch (e) {}
    })();
  </script>
</body>
</html>
